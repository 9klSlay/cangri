<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revienta las burbujas</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTiNzDadtuwl5RzjR1wvtAlUwbDTMb6lCj7fLaVTMz3g&s=10">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        /* CONTADOR */
        #contador {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;

            color: white;
            font-size: 28px;
            font-weight: bold;

            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 12px;

            user-select: none;
        }

        /* ÁREA DEL JUEGO */
        #juego {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* BURBUJA */
        .burbuja {
            position: absolute;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: radial-gradient(
                circle at 30% 25%,
                #fff8b0,
                #ffd700 35%,
                #ffae00 70%,
                #d88600
            );

            border: 3px solid #fff1a8;

            box-shadow:
                0 0 10px #ffd700,
                0 0 25px #ffb700,
                inset -8px -8px 15px rgba(0, 0, 0, 0.2);

            cursor: pointer;

            animation: aparecer 0.2s ease-out;
        }

        /* BRILLITO */
        .burbuja::before {
            content: "";

            position: absolute;

            width: 15px;
            height: 15px;

            top: 12px;
            left: 15px;

            background: white;
            border-radius: 50%;

            opacity: 0.8;
        }

        @keyframes aparecer {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* EFECTO CUANDO REVIENTA */
        .explosion {
            position: absolute;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            border: 4px solid #ffd700;

            pointer-events: none;

            animation: explotar 0.35s ease-out forwards;
        }

        @keyframes explotar {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* PANTALLA FINAL */
        #final {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            background: black;
        }

        #final img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }
    </style>
</head>

<body>

    <!-- CONTADOR -->
    <div id="contador">0/10</div>

    <!-- JUEGO -->
    <div id="juego"></div>

    <!-- PANTALLA FINAL -->
    <div id="final">
        <img src="cangri.png" alt="Cangri">
    </div>

    <!-- AUDIO -->
    <audio id="musica" src="cangri.mp3"></audio>

    <script>
        const juego = document.getElementById("juego");
        const contador = document.getElementById("contador");
        const final = document.getElementById("final");
        const musica = document.getElementById("musica");

        let puntos = 0;
        const objetivo = 10;

        function crearBurbuja() {

            // Si ya llegamos a 10, no salen más
            if (puntos >= objetivo) {
                return;
            }

            const burbuja = document.createElement("div");

            burbuja.classList.add("burbuja");

            // Tamaño de la burbuja
            const tamaño = 70;

            // Posición aleatoria
            const x = Math.random() * (window.innerWidth - tamaño);
            const y = Math.random() * (window.innerHeight - tamaño);

            burbuja.style.left = x + "px";
            burbuja.style.top = y + "px";

            // Cuando le haces click
            burbuja.addEventListener("click", function () {

                puntos++;

                contador.textContent = puntos + "/" + objetivo;

                // Crear efecto de explosión
                const explosion = document.createElement("div");
                explosion.classList.add("explosion");

                explosion.style.left = x + "px";
                explosion.style.top = y + "px";

                juego.appendChild(explosion);

                // Quitar la burbuja
                burbuja.remove();

                // Quitar explosión después de la animación
                setTimeout(() => {
                    explosion.remove();
                }, 350);

                // ¿Llegó a 10?
                if (puntos >= objetivo) {
                    terminarJuego();
                } else {
                    // Crear otra burbuja
                    crearBurbuja();
                }
            });

            juego.appendChild(burbuja);
        }


        function terminarJuego() {

            // No crear más burbujas
            juego.innerHTML = "";

            // Mostrar imagen
            final.style.display = "block";

            // Intentar reproducir música
            musica.currentTime = 0;
            musica.play().catch(error => {
                console.log("El navegador bloqueó el audio:", error);
            });
        }


        // Primera burbuja
        crearBurbuja();
    </script>

</body>
</html>
